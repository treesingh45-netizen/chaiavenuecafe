<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" fill="none">
  <!-- Steam bar 1 (Left: shortest) -->
  <rect x="122" y="55" width="13" height="38" rx="6.5" fill="#F4B62F" />
  <!-- Steam bar 2 (Middle: tallest) -->
  <rect x="142" y="15" width="13" height="78" rx="6.5" fill="#F4B62F" />
  <!-- Steam bar 3 (Right: medium) -->
  <rect x="162" y="36" width="13" height="57" rx="6.5" fill="#F4B62F" />

  <!-- Cup body with cut-out 5-pointed star using evenodd fill rule -->
  <path
    fill-rule="evenodd"
